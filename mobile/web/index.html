<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pindo Future - Next-Generation Live Educational Streaming Platform with Interactive Whiteboard, DZD Monetization, and Guardian Oversight.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pindo Future">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pindo Future • Live Educational Platform</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Cache buster to ensure instant hot refreshes during development -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <!-- Pindo Future Web Anti-Piracy & Anti-Screen-Capture Shield -->
  <script>
    (function() {
      // 1. Block right click context menu on video and educational canvas
      window.addEventListener('contextmenu', function(e) {
        // Prevent inspection and direct media extraction
        e.preventDefault();
        return false;
      }, false);

      // 2. Intercept DevTools and screenshot key combinations
      window.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (DevTools)
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
          e.preventDefault();
          return false;
        }
        // Ctrl+U (View Source), Ctrl+S (Save Page)
        if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
          e.preventDefault();
          return false;
        }
        // PrintScreen key
        if (e.key === 'PrintScreen') {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('Protected Content • Pindo Future DRM');
          }
          e.preventDefault();
          return false;
        }
      }, false);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
