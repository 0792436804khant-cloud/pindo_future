services:
  postgres:
    image: postgres:16-alpine
    container_name: pindo_future_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pindo_future}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pindo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pindo_future"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pindo_future_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pindo_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: pindo_future_livekit
    restart: unless-stopped
    command: ["--dev", "--node-ip", "127.0.0.1", "--keys", "devkey_pindo_future: secret_pindo_future_webrtc_cluster_key_123"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - pindo_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pindo_future_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: pindo_future
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/var/www
    networks:
      - pindo_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pindo_network:
    driver: bridge
