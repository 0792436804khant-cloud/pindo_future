services:
  # 1. Reverse Proxy & Load Balancer (NGINX)
  nginx:
    image: nginx:alpine
    container_name: pindo_future_loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/public:/var/www/public:ro
    depends_on:
      - api
    networks:
      - pindo_network

  # 2. Database Layer (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: pindo_future_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pindo_future}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pindo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pindo_future"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. High-Speed In-Memory Caching & Queue Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: pindo_future_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pindo_network

  # 4. LiveKit WebRTC SFU Cluster (Live Classroom Streams)
  livekit:
    image: livekit/livekit-server:latest
    container_name: pindo_future_livekit
    restart: unless-stopped
    command: ["--dev", "--node-ip", "127.0.0.1", "--keys", "devkey_pindo_future: secret_pindo_future_webrtc_cluster_key_123"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - pindo_network

  # 5. Core Stateless Application API (Laravel)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pindo_future_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pindo_future}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./backend/storage:/var/www/storage
    networks:
      - pindo_network

  # 6. Background Asynchronous Queue Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pindo_future_queue_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=high-priority,notifications,attendance,media-processing,default", "--tries=3", "--timeout=90", "--sleep=1"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pindo_future}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    volumes:
      - ./backend/storage:/var/www/storage
    networks:
      - pindo_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pindo_network:
    driver: bridge
